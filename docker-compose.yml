services:
  db:
    image: timescale/timescaledb:2.32.0-pg17
    environment:
      # Dev-only credentials (see README); real deployments inject them from a secrets manager.
      POSTGRES_DB: miniwsa
      POSTGRES_USER: miniwsa
      POSTGRES_PASSWORD: miniwsa
      TIMESCALEDB_TELEMETRY: "off"
    ports: ["${DB_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U miniwsa -d miniwsa"]
      interval: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:8.10.3-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  app:
    build: { context: ., target: app }
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Dev-only keys, documented in the README.
      MINIWSA_INGEST_KEY: dev-ingest-key
      MINIWSA_READ_KEY: dev-read-key
      MINIWSA_ADMIN_KEY: dev-admin-key
    ports: ["${APP_PORT:-8080}:8080"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Seeds the running app with generated events: docker compose --profile seed run --rm seed
  seed:
    build: { context: ., target: generator }
    profiles: [seed]
    environment:
      MINIWSA_API_KEY: dev-ingest-key   # dev-only key, documented in the README
    command: ["--target", "http://app:8080", "--count", "10000", "--wait-for-health"]
    depends_on: [app]

volumes:
  db-data: {}
