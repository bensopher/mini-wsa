spring:
  application.name: mini-wsa
  # The workload is I/O-bound (Postgres, Redis): every request runs on a cheap virtual thread,
  # and concurrency is bounded at the resources (connection pools) instead.
  threads.virtual.enabled: true
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/miniwsa
    username: miniwsa
    password: ${MINIWSA_DB_PASSWORD:miniwsa}   # dev default only
    hikari:
      # Virtual threads make waiting cheap but don't make the database faster: this pool is the real
      # throttle on concurrent DB work. Waiters give up after 2s so overload turns into fast 503s
      # instead of an ever-growing queue.
      maximum-pool-size: 10
      connection-timeout: 2000
  data.redis:
    host: localhost
    port: ${REDIS_PORT:6379}
    # Lettuce's default command timeout is 60s. Redis is optional for ingestion (fail-open), so an outage
    # must cost at most half a second per request, not a minute.
    timeout: 500ms
    connect-timeout: 500ms
miniwsa:
  ingest:
    max-batch-size: 1000
    max-future-skew: 5m      # A3
  scoring:
    sensitive-path: { patterns: [/admin, /login], bonus: 15 }   # A7
    # A5/A6: window in event time. Retention = window + allowed lateness; idle IP keys expire after key-ttl.
    repeat-offender: { threshold: 5, bonus: 15, window: 10m, retention: 1h, key-ttl: 2h }
  query:
    default-range: 24h   # A8
    max-range: 90d       # bounds how much data one query can scan
    # A deep offset makes Postgres read and discard every skipped row, so it is capped.
    samples: { default-limit: 20, max-limit: 100, max-offset: 10000 }
  security:
    # Dev defaults only (documented in the README); real deployments inject keys from a secrets manager via env.
    api-keys:
      - { name: edge-ingest, key: "${MINIWSA_INGEST_KEY:dev-ingest-key}", roles: [INGEST] }
      - { name: dashboard,   key: "${MINIWSA_READ_KEY:dev-read-key}",     roles: [READ] }
      - { name: soc-admin,   key: "${MINIWSA_ADMIN_KEY:dev-admin-key}",   roles: [READ, ADMIN] }
  limits:
    max-request-body: 5MB
    read-query-timeout: 5s   # per statement; a timeout becomes a 503
    json: { max-nesting-depth: 20, max-string-length: 65536 }
server:
  # Container-level errors (outside Spring MVC) must not leak exception text or stack traces either.
  error:
    include-stacktrace: never
    include-message: never
management:
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health:
    # Health is public, so it lists each component's UP/DOWN only. Details (disk paths and sizes, database
    # product) stay hidden.
    show-components: always
    # /actuator/health/liveness and /actuator/health/readiness, for an orchestrator's probes. Redis is left out
    # of readiness on purpose: ingestion fails open without it, so a Redis outage must not take every instance
    # out of the load balancer. The overall /actuator/health still reports Redis.
    probes.enabled: true
    group.readiness.include: readinessState,db
